apiVersion: 1
groups:
    - orgId: 1
      name: chat-api-alerts
      folder: alerts
      interval: 30s
      rules:
        - uid: bg48yeqp5la80b
          title: High API Response Time
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: fg4759z7kfsw0b
              model:
                editorMode: code
                expr: "histogram_quantile(\r\n    0.95,\r\n    sum by (le) (\r\n        rate(\r\n            http_request_duration_seconds_bucket{endpoint!=\"metrics/\"}[5m]\r\n        )\r\n    )\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 2m
          keepFiringFor: 30s
          annotations:
            description: The 95th percentile API response time has exceeded 1 second for at least 2 minutes. Investigate slow API endpoints and database queries.
            summary: Chat API response time is too high
          isPaused: false
          notification_settings:
            receiver: Local Webhook Receiver

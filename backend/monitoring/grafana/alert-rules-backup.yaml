apiVersion: 1

groups:
  - orgId: 1
    name: chat-api-alerts
    folder: alerts
    interval: 30s
    rules:
      - uid: high-api-response-time
        title: High API Response Time
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: YOUR_PROMETHEUS_DATASOURCE_UID
            model:
              expr: |
                histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(
                      http_request_duration_seconds_bucket{
                        endpoint!="metrics/"
                      }[5m]
                    )
                  )
                )
              instant: true
              refId: A

          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                    conditions:
                      - evaluator:
                          params: []
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - C
                        reducer:
                          type: last
                        type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
              conditions: []

        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Chat API response time is too high
          description: The 95th percentile API response time has exceeded 1 second for at least 2 minutes. Investigate slow API endpoints and database queries.
        labels:
          severity: warning